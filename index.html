<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + React + Typescript</title>
    <!--
      起動直後 (React が描画するまで) に表示するスピナーのスタイル。
      この時点では Tailwind の CSS がまだ読み込まれていないことがあるので、ここに直接書く。
      見た目は src/components/Loading.tsx に合わせている (色は Tailwind v4 の indigo-100 / indigo-600)
    -->
    <style>
      .boot-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.6);
      }
      .boot-loading-spinner {
        width: 48px;
        height: 48px;
        box-sizing: border-box;
        border: 4px solid oklch(93% 0.034 272.788);
        border-top-color: oklch(51.1% 0.262 276.966);
        border-radius: 50%;
        animation: boot-spin 1s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <!-- #root の中身は React の描画時に置き換わるので、スピナーを消すコードは不要 -->
    <div id="root">
      <div class="boot-loading">
        <div class="boot-loading-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
